<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}E-Commerce BI Dashboard{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">📊</span> E-Commerce BI Dashboard</div>
    <nav>
      <a href="{{ url_for('main.dashboard') }}" class="{{ 'active' if request.endpoint == 'main.dashboard' }}">Dashboard</a>
      <a href="{{ url_for('main.kpi_definitions_page') }}" class="{{ 'active' if request.endpoint == 'main.kpi_definitions_page' }}">KPI Definitions</a>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="footer">Sample data is fictional · Flask · MySQL · Pandas · NumPy · Matplotlib</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
