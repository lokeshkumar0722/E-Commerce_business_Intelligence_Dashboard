{% extends "base.html" %}
{% block content %}
<section class="filters card" id="filters">
  <div class="field"><label for="start">From</label><input type="date" id="start"></div>
  <div class="field"><label for="end">To</label><input type="date" id="end"></div>
  <div class="field"><label for="region">Region</label><select id="region"><option value="">All regions</option></select></div>
  <div class="field"><label for="category">Category</label><select id="category"><option value="">All categories</option></select></div>
  <div class="presets" role="group" aria-label="Quick ranges">
    <button type="button" data-days="30">30 days</button>
    <button type="button" data-days="90">90 days</button>
    <button type="button" data-days="365" class="on">12 months</button>
    <button type="button" data-days="0">All time</button>
  </div>
  <a id="download" class="btn" href="#">⬇ KPI report (CSV)</a>
</section>

<p id="periodInfo" class="period-info" aria-live="polite"></p>
<div id="alert" class="alert" hidden></div>

<section class="kpi-grid" id="kpis" aria-label="Key performance indicators"></section>

<section class="grid-2">
  <figure class="card chart wide"><img id="c-monthly_revenue" alt="Monthly gross vs net sales chart"></figure>
  <figure class="card chart"><img id="c-mom_growth" alt="Month-over-month growth chart"></figure>
  <figure class="card chart"><img id="c-sales_bridge" alt="Gross to net sales bridge chart"></figure>
  <figure class="card chart"><img id="c-category_comparison" alt="Category comparison chart"></figure>
  <figure class="card chart"><img id="c-region_comparison" alt="Region comparison chart"></figure>
  <figure class="card chart"><img id="c-top_products" alt="Top products chart"></figure>
  <figure class="card chart"><img id="c-order_status" alt="Order status mix chart"></figure>
</section>

<section class="grid-3">
  <div class="card"><h2>Category performance</h2><div class="table-wrap"><table id="t-category"></table></div></div>
  <div class="card"><h2>Region performance</h2><div class="table-wrap"><table id="t-region"></table></div></div>
  <div class="card"><h2>Top products</h2><div class="table-wrap"><table id="t-products"></table></div></div>
</section>
{% endblock %}
{% block scripts %}
<script>window.CURRENCY = {{ currency|tojson }}; window.CHARTS = {{ charts|tojson }};</script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
